# Keeps the free Supabase project from pausing after a week of inactivity.
# Needs two repo secrets (Settings -> Secrets and variables -> Actions): SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.
# Publishable (anon) key ONLY. Never put the secret/service key here.
name: keepalive
on:
  schedule:
    - cron: "17 6,18 * * *" # twice a day (UTC)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -eu
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY must be set as repo secrets"
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          check() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 "$@")
            echo "$code <- $LABEL"
            case "$code" in 2??) ;; *) echo "::error::$LABEL returned HTTP $code"; exit 1 ;; esac
          }
          # 1) Auth service health (GET).
          LABEL="GET /auth/v1/health"
          check -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$base/auth/v1/health"
          # 2) A real, read-only database call that is callable signed out (touches Postgres, changes nothing).
          LABEL="POST /rest/v1/rpc/member_name_status"
          check -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}' "$base/rest/v1/rpc/member_name_status"
